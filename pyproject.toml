[project]
name = "backtester-demo"
version = "0.1.0"
description = "Volatility forecasting (HAR, GARCH, LSTM) across realised-vol estimators, backtested with vectorbt"
readme = "README.md"
authors = [
    { name = "Tsunbert", email = "constantinrobert.stefan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "vectorbt>=1.2.0",
    "yfinance>=1.7.0",
]

[project.scripts]
backtester-demo = "backtester_demo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
